version: "3.8"
name: face_ekyc_service
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - DOCKER_BUILDKIT=1
        - COMPOSE_DOCKER_CLI_BUILD=1
    container_name: fastapi_app
    depends_on:
      - postgres_db
      - redis_db
    ports:
      - "${FASTAPI_PORT}:8000"
    env_file:
      - .env
    environment:
      - DOCKER_BUILDKIT=1
      - COMPOSE_DOCKER_CLI_BUILD=1
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - web_data:/data/web
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "${MINIO_PORT}:9000"  # API
      - "${MINIO_CONSOLE_PORT}:9001"  # Console UI
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY}"
    volumes:
      - minio-data:/data/minio

volumes:
  web_data:
  minio-data: