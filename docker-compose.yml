version: "3.8"
name: face_ekyc_service
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - DOCKER_BUILDKIT=1
        - COMPOSE_DOCKER_CLI_BUILD=1
    container_name: web_face_ekyc
    depends_on:
      - minio
      - elasticsearch
    ports:
      - "${FASTAPI_PORT}:8000"
    env_file:
      - .env
    environment:
      - DOCKER_BUILDKIT=1
      - COMPOSE_DOCKER_CLI_BUILD=1
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - web_data:/data/web
      - hf_cache:/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "${MINIO_PORT}:9000"  # API
      - "${MINIO_CONSOLE_PORT}:9001"  # Console UI
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY}"
    command: server /data --console-address ":9001"
    restart: unless-stopped
    volumes:
      - minio-data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
#      - node.name=es-node
#      - cluster.name=es-cluster
      - xpack.security.enabled=true # Change to false when in development mode
#      - bootstrap.memory_lock=true
      - ELASTIC_PASSWORD=${ES_PASSWORD}
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "${ES_PORT}:9200"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.1
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - KIBANA_SERVICE_ACCOUNT_TOKEN=${KIBANA_TOKEN}
    ports:
      - "${KIBANA_PORT}:5601"
    depends_on:
      - elasticsearch
volumes:
  web_data:
  hf_cache:
    driver: local
  minio-data:
  esdata:
    driver: local
